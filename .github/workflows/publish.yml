# Builds and publishes the site whenever the default branch changes — including every "Publish" from /admin/.
#
#   1. checks content/*.json (tools/build.mjs stops on errors, so the live site keeps its last good version)
#   2. rebuilds every page, prerender snapshot, share image, sitemap …
#   3. commits the generated files back, so the repository always matches the live site
#   4. deploys to GitHub Pages
#
# Works with either Pages setting (Settings → Pages → Source):
#   • "GitHub Actions" (recommended): this workflow deploys the built site itself
#   • "Deploy from a branch": the branch is the site, so the workflow asks Pages to rebuild after its commit
name: Publish site

on:
  push:
  workflow_dispatch:

# One publish at a time; a newer push waits for the running one instead of cancelling it half-way.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # newest commit, even if this run waited in the queue

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium

      - name: Install Playwright
        run: |
          npm install --global playwright@1.56.1
          playwright install --with-deps chromium

      - name: Build
        run: node tools/build.mjs

      - name: Commit generated files
        run: |
          git config user.name "rikaz-publish[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "Build site" -m "Generated by the Publish site workflow from $(git rev-parse --short HEAD)."
          # If someone published again meanwhile, their own run rebuilds everything — no need to retry here.
          git push origin HEAD:${{ github.event.repository.default_branch }} || echo "::warning::Branch moved on; the next run publishes the newer version."

      - name: Check how Pages publishes
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo legacy)
          echo "Pages build type: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Rebuild Pages from the branch
        if: steps.pages.outputs.mode != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build; it will run on the next push."

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.mode == 'workflow'

      - name: Collect site files
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'tools' --exclude 'content' --exclude 'docs' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: _site

    outputs:
      mode: ${{ steps.pages.outputs.mode }}

  deploy:
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

// decode rings -> [[lon,lat],...]
const DT = '0123456789ABCDEFGHIJKLMNOPQRSTUV', DC = 'abcdefghijklmnopqrstuvwxyz!#$%&*';
const decode = (s, u = 100) => {
  const v = []; let z = 0, m = 1;
  for (const ch of s) {
    const t = DT.indexOf(ch);
    if (t < 0) { z += DC.indexOf(ch) * m; m *= 32; continue; }
    z += t * m; v.push(z % 2 ? -(z + 1) / 2 : z / 2); z = 0; m = 1;
  }
  const pts = []; let x = 0, y = 0;
  for (let i = 0; i < v.length; i += 2) pts.push([(x += v[i]) / u, (y += v[i + 1]) / u]);
  return pts;
};
const LAND = GEO.land.map(s => decode(s)), MESH = GEO.mesh.map(s => decode(s)), LIBYA = GEO.libya.map(s => decode(s, 1000));

// Mercator with d3.geoMercator().fitExtent semantics (fitted to Libya's bounds)
const R = Math.PI / 180;
const merc = ([lon, lat]) => [lon * R, -Math.log(Math.tan(Math.PI / 4 + lat * R / 2))];
const fitMercator = ([[x0, y0], [x1, y1]]) => {
  const [bx0, by0] = merc(GEO.libyaB[0]), [bx1, by1] = merc(GEO.libyaB[1]);
  const w = x1 - x0, h = y1 - y0, k = Math.min(w / (bx1 - bx0), h / (by1 - by0));
  const tx = x0 + (w - k * (bx1 + bx0)) / 2, ty = y0 + (h - k * (by1 + by0)) / 2;
  return (p) => { const [x, y] = merc(p); return [k * x + tx, k * y + ty]; };
};
const pathOf = (proj, lines, close) => lines.map(l => 'M' + l.map(p => proj(p).map(v => v.toFixed(2)).join(',')).join('L') + (close ? 'Z' : '')).join('');
// centripetal Catmull-Rom (d3.curveCatmullRom.alpha(0.5)) as cubic Béziers
const catmullRom = (pts) => {
  const f = (v) => +v.toFixed(2), P = [pts[0], ...pts, pts[pts.length - 1]];
  const d = (a, b) => Math.sqrt(Math.hypot(a[0] - b[0], a[1] - b[1]));   // |ab|^alpha
  let s = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 1; i < P.length - 2; i++) {
    const [p0, p1, p2, p3] = [P[i - 1], P[i], P[i + 1], P[i + 2]];
    const l01 = i > 1 ? d(p0, p1) : 0, l12 = d(p1, p2), l23 = i < P.length - 3 ? d(p2, p3) : 0;
    let c1 = p1, c2 = p2;
    if (l01 > 1e-12) { const a = 2 * l01 * l01 + 3 * l01 * l12 + l12 * l12, n = 3 * l01 * (l01 + l12);
      c1 = [0, 1].map(j => (p1[j] * a - p0[j] * l12 * l12 + p2[j] * l01 * l01) / n); }
    if (l23 > 1e-12) { const b = 2 * l23 * l23 + 3 * l23 * l12 + l12 * l12, m = 3 * l23 * (l23 + l12);
      c2 = [0, 1].map(j => (p2[j] * b + p1[j] * l23 * l23 - p3[j] * l12 * l12) / m); }
    s += `C${f(c1[0])},${f(c1[1])},${f(c2[0])},${f(c2[1])},${f(p2[0])},${f(p2[1])}`;
  }
  return s;
};
// tiny SVG builder: null attributes are skipped
const add = (parent, tag, attrs = {}, text) => {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  if (text != null) el.textContent = text;
  return parent.appendChild(el);
};

  const minor = new Set(['Zawiya','Al Khums','Zliten','Al Bayda']);
  const smallPos = { Benghazi:[0,20,'middle'], Tripoli:[0,-12,'middle'], Misrata:[4,16,'middle'], Sirte:[0,16,'middle'], Tobruk:[0,-9,'middle'], Sabha:[8,4,'start'] };
  const rank = (c) => c.s === 'hub' ? 0 : minor.has(c.n) ? 2 : 1;
  const order = [...cities].sort((a, b) => rank(a) - rank(b));
  const lg = add(svg, 'g', {'font-family': FONT});
  const placed = [];
  const hit = (b) => placed.some(p => b.x < p.x + p.width + 2 && b.x + b.width + 2 > p.x && b.y < p.y + p.height && b.y + b.height > p.y);
  order.forEach(c => {
    if (small && minor.has(c.n)) return;
    const [x, y] = proj(c.c), [dx, dy, anchor] = (small && smallPos[c.n]) || c.l;
    const hub = c.s === 'hub';
    const el = add(lg, 'text', {x: x + dx, y: y + dy, 'text-anchor': anchor,
      'font-size': hub ? (tiny ? 11 : small ? 12 : 13) : (tiny ? 10 : small ? 10.5 : 11.5), 'font-weight': hub ? 600 : 500,
      fill: c.s === 'soon' ? MUTED : (hub ? GREEN : INK),
      stroke: '#fff', 'stroke-width': 3.5, 'stroke-linejoin': 'round', 'paint-order': 'stroke'}, AR ? c.a : c.n);
    const b = el.getBBox();
    if (b.x < 2 || b.x + b.width > W - 2 || b.y < 2 || hit(b)) { el.remove(); return; }
    placed.push(b);
  });
  svg.querySelectorAll('text.deco').forEach(el => { if (hit(el.getBBox())) el.remove(); });
  // scale bar
  const [a1] = proj([10.5, 20.3]), [a2] = proj([10.5 + 500 / (111.32 * Math.cos(20.3 * Math.PI / 180)), 20.3]);
  const sbw = a2 - a1, sbx = W - 16 - sbw, sby = H - 14;
  const sb = add(svg, 'g', {display: tiny ? 'none' : null, 'font-family': FONT, 'font-size': 10, fill: MUTED});
  add(sb, 'path', {d: `M${sbx},${sby - 4}V${sby}H${sbx + sbw}V${sby - 4}`, fill: 'none', stroke: MUTED, 'stroke-width': 1});
  add(sb, 'text', {x: sbx + sbw / 2, y: sby - 7, 'text-anchor': 'middle'}, AR ? '500 كم' : '500 km');
}
draw();                                        // draw now so nothing is blank…
if (document.fonts) document.fonts.ready.then(draw);   // …and again with real font metrics for getBBox
let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 120); });
</script>

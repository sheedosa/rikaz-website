<script>
// Old share links used #/… routes — send them to the matching clean URL.
if (/^#\/./.test(location.hash)) location.replace('/' + location.hash.slice(2).replace(/\/?$/, '/'));
// Arabic pages used to live under ar/; they are now at the root.
else if (location.pathname.indexOf('/ar/') === 0) location.replace('/' + location.pathname.slice(4));
</script>
